<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trạm Đọc - Khám Phá Thế Giới Tri Thức</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                        nunito: ['Nunito', 'sans-serif'],
                    },
                    colors: {
                        primary: '#8b5cf6',
                        secondary: '#f43f5e',
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'float-slow': 'floatSlow 8s ease-in-out infinite',
                        'pulse-glow': 'pulseGlow 3s ease-in-out infinite',
                        'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0) rotate(0deg)' },
                            '50%': { transform: 'translateY(-18px) rotate(-2deg)' },
                        },
                        floatSlow: {
                            '0%, 100%': { transform: 'translateY(0) rotate(0deg)' },
                            '50%': { transform: 'translateY(-12px) rotate(2deg)' },
                        },
                        pulseGlow: {
                            '0%, 100%': { opacity: '0.6', transform: 'scale(1)' },
                            '50%': { opacity: '1', transform: 'scale(1.05)' },
                        },
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #fdfdfc;
            color: #334155;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* Dark Mode Body */
        .dark body {
            background-color: #07070a; 
            color: #cbd5e1;
        }

        /* --- BẦU TRỜI SAO TRONG DARK MODE --- */
        #starry-background {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
            background: transparent;
        }
        
        .dark #starry-background {
            display: block !important; 
        }

        .star {
            position: absolute;
            background-color: #ffffff !important; 
            border-radius: 50%;
            opacity: 0;
        }

        @keyframes starTwinkle {
            0% { opacity: 0.1; transform: scale(0.9); box-shadow: 0 0 1px 0 rgba(255,255,255,0.05); }
            50% { opacity: 0.6; transform: scale(1.1); box-shadow: 0 0 4px 1px rgba(255,255,255,0.3); }
            100% { opacity: 0.1; transform: scale(0.9); box-shadow: 0 0 1px 0 rgba(255,255,255,0.05); }
        }

        /* Scroll Reveal Effect */
        .reveal {
            opacity: 0;
            transform: translateY(40px);
            transition: all 0.8s cubic-bezier(0.5, 0, 0, 1);
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Hiệu ứng Header */
        .header-transition {
            transition: padding 0.4s ease-in-out, background-color 0.4s ease-in-out, box-shadow 0.4s ease-in-out;
        }

        #navbar.scrolled {
            background-color: #000000 !important;
            border-bottom-color: rgba(255,255,255,0.1) !important;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5), 0 4px 6px -2px rgba(0, 0, 0, 0.3) !important;
        }
        
        #navbar.scrolled .group:hover .nav-text,
        #navbar.scrolled .group:hover .icon-text,
        #navbar.scrolled .nav-text:hover,
        #navbar.scrolled button:hover .nav-text {
            color: #ec4899 !important;
        }

        .dark #navbar.scrolled .group:hover .nav-text,
        .dark #navbar.scrolled .group:hover .icon-text,
        .dark #navbar.scrolled .nav-text:hover,
        .dark #navbar.scrolled button:hover .nav-text {
            color: #60a5fa !important;
        }

        #navbar.scrolled .nav-icon-wrapper {
            background-color: rgba(255, 255, 255, 0.1) !important;
            border-color: transparent !important;
        }
        
        #navbar.scrolled .nav-icon-wrapper:hover {
            background-color: rgba(255, 255, 255, 0.2) !important;
        }

        #navbar.scrolled .search-input:focus {
            background-color: rgba(255, 255, 255, 0.15) !important;
            border-color: #f472b6 !important;
            box-shadow: 0 0 0 2px rgba(244, 114, 182, 0.2) !important;
        }

        .dark #navbar.scrolled .search-input:focus {
            border-color: #8b5cf6 !important;
            box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2) !important;
        }
    
        /* ================= THANH LOGO NHÀ XUẤT BẢN ================= */
        .publisher-bar {
            width: 100%;
            height: 180px; 
            margin-top: 24px;
            margin-bottom: 24px;
            background: #ffffff;
            border-top: 1px solid #f1f5f9;
            border-bottom: 1px solid #f1f5f9;
            overflow: hidden;
            display: flex;
            align-items: center;
            position: relative;
            -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,0), rgba(0,0,0,1) 15%, rgba(0,0,0,1) 85%, rgba(0,0,0,0));
            mask-image: linear-gradient(to right, rgba(0,0,0,0), rgba(0,0,0,1) 15%, rgba(0,0,0,1) 85%, rgba(0,0,0,0));
        }
        
        .dark .publisher-bar {
            background: transparent; 
            border-color: rgba(255, 255, 255, 0.05);
        }

        .publisher-track {
            display: flex;
            align-items: center;
            width: max-content;
            animation: publisher-scroll 45s linear infinite; 
        }

        .publisher-group {
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .publisher-item {
            width: 280px; 
            height: 140px; 
            margin: 0 40px; 
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .publisher-item img {
            display: block;
            max-width: 240px; 
            max-height: 120px; 
            width: auto;
            height: auto;
            object-fit: contain;
            transition: transform 0.3s ease, filter 0.3s ease, opacity 0.3s ease;
        }

        .dark .publisher-item img {
            opacity: 0.9;
        }

        .publisher-item:hover img {
            transform: scale(1.15); 
        }
        .dark .publisher-item:hover img {
            opacity: 1;
        }

        @keyframes publisher-scroll {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }

        .publisher-bar:hover .publisher-track {
            animation-play-state: paused;
        }

        @media (max-width: 1024px) {
            .publisher-bar { height: 120px; }
            .publisher-item { width: 200px; height: 90px; margin: 0 20px; }
            .publisher-item img { max-width: 160px; max-height: 75px; }
        }

        /* --- XỬ LÝ CHATBOT UI MỚI --- */
        #chatbot-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 40;
            display: flex;
            align-items: flex-end;
        }

        #chat-window {
            position: absolute;
            bottom: 0;
            right: 75px;
            width: 380px;
            height: 680px;
            max-height: calc(100vh - 120px);
            background: #18181b;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4), 0 5px 15px rgba(0,0,0,0.2);
            display: none;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            transform-origin: bottom right;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            font-family: 'Inter', sans-serif;
        }

        #chat-window.show {
            display: flex;
            animation: scaleUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes scaleUp {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        #chat-toggle-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            padding: 3px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s, background 0.3s;
        }
        
        #chat-toggle-btn:hover {
            transform: scale(1.05);
        }

        .chat-scroll::-webkit-scrollbar { width: 5px; }
        .chat-scroll::-webkit-scrollbar-track { background: transparent; }
        .chat-scroll::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        .chat-scroll::-webkit-scrollbar-thumb:hover { background: #52525b; }

        /* Hiệu ứng Thẻ Sách 3D */
        .book-3d-card {
            border-radius: 16px;
            box-shadow: -2px 0 4px rgba(0,0,0,0.04), 4px 6px 12px rgba(0,0,0,0.08);
            transition: border-radius 0.25s ease, box-shadow 0.25s ease, transform 0.25s ease;
        }
        .book-item:hover .book-3d-card {
            border-radius: 20px;
            transform: translateY(-3px);
        }
        .book-hover-panel {
            width: calc(290% + 24px);
            border-radius: 18px;
        }
        @media (min-width: 768px) {
            .book-hover-panel { width: calc(290% + 28px); }
        }
        @media (min-width: 1024px) {
            #dynamic-categories-container [id^="slider-"] {
                gap: 24px !important;
                padding-left: 2px;
                padding-right: 2px;
                box-sizing: border-box;
            }
            #dynamic-categories-container .book-item {
                box-sizing: border-box !important;
                width: calc((100% - 96px) / 5) !important;
                min-width: 0 !important;
                max-width: calc((100% - 96px) / 5) !important;
                flex: 0 0 calc((100% - 96px) / 5) !important;
            }
            #dynamic-categories-container .book-item > .relative {
                min-width: 0;
            }
        }
        .dark .book-3d-card {
            box-shadow: -2px 0 4px rgba(0,0,0,0.4), 4px 6px 12px rgba(0,0,0,0.6);
            border-color: rgba(255,255,255,0.05);
        }
        
        .book-3d-card::before {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            width: 16px;
            background: linear-gradient(to right, rgba(0,0,0,0.35) 0%, rgba(255,255,255,0.15) 25%, rgba(0,0,0,0.05) 50%, transparent 100%);
            z-index: 5;
            pointer-events: none;
        }
        
        .book-3d-card:hover {
            box-shadow: -2px 0 4px rgba(0,0,0,0.04), 8px 15px 25px rgba(0,0,0,0.15);
        }
        .dark .book-3d-card:hover {
            box-shadow: -2px 0 4px rgba(0,0,0,0.4), 8px 15px 25px rgba(0,0,0,0.8);
        }
        
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Hiệu ứng gạch xiên cho giá tiền flash sale */
        .flash-sale-strike {
            text-decoration: line-through;
            text-decoration-color: #9ca3af;
        }

        /* Hiệu ứng cuộn 7 cuốn sách ở phần Hero (Trang chủ) */
        .hero-scroll-container {
            overflow: hidden;
            width: 100%;
            position: relative;
            /* Làm mờ 2 cạnh trái/phải để sách trôi ra/vào mượt hơn */
            -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,0), rgba(0,0,0,1) 10%, rgba(0,0,0,1) 90%, rgba(0,0,0,0));
            mask-image: linear-gradient(to right, rgba(0,0,0,0), rgba(0,0,0,1) 10%, rgba(0,0,0,1) 90%, rgba(0,0,0,0));
        }

        .hero-scroll-track {
            display: flex;
            align-items: center;
            width: max-content;
            animation: hero-scroll-left 30s linear infinite; /* Điều chỉnh 30s để đổi tốc độ */
        }

        /* Tạm dừng cuộn khi đưa chuột vào */
        .hero-scroll-container:hover .hero-scroll-track {
            animation-play-state: paused;
        }

        .hero-book-item {
            width: 220px;
            height: 330px;
            margin: 0 15px;
            flex-shrink: 0;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .hero-book-item:hover {
            transform: translateY(-15px) scale(1.05);
            box-shadow: 0 25px 50px rgba(236, 72, 153, 0.4); /* Bóng màu hồng nhẹ khi hover */
            z-index: 50;
        }

        .hero-book-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: inherit;
        }

        @keyframes hero-scroll-left {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); } /* Cuộn đúng 50% độ dài để lặp lại mượt */
        }
    </style>
</head>
<body class="antialiased flex flex-col min-h-screen relative">

    <!-- NAVBAR -->

    <main class="flex-grow relative z-10">
        <!-- TRANG CHỦ -->

                <img src="img/anh-mo-ta.jfif" onerror="this.src='https://images.unsplash.com/photo-1481627834876-b7833e8f5570?q=80&w=2000&auto=format&fit=crop'" alt="Background" class="w-full h-full object-cover dark:opacity-15 transition-opacity duration-500">

                            Đọc sách <br />
                            <span class="text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-rose-500 dark:from-[#60a5fa] dark:to-[#c084fc]">mọi lúc,</span> <br />
                            mọi nơi <span class="inline-block animate-bounce drop-shadow-md" style="animation-duration: 2s;">🌸</span>

        <script>
            document.addEventListener('DOMContentLoaded', () => {

                    { title: "Trường Ca Achilles", author: "Madeline Miller", img: "https://images.unsplash.com/photo-1543002588-bfa74002ed7e?q=80&w=400&auto=format&fit=crop", desc: "Tác phẩm tuyệt đẹp làm sống lại câu chuyện sử thi Hy Lạp về tình bạn sâu sắc và tình yêu định mệnh giữa Achilles và Patroclus." },

                    { title: "Khuyến Học", author: "Fukuzawa Yukichi", img: "https://images.unsplash.com/photo-1556761175-5973dc0f32d7?q=80&w=400&auto=format&fit=crop", desc: "Cuốn sách nền tảng đánh thức tinh thần tự lập và tầm quan trọng của tri thức." }
                ];

                const listContainer = document.getElementById('top-books-list');
                let listHtml = '';

                topBooks.forEach((book, index) => {
                    const rank = index + 1;
                    const isTop1 = rank === 1;
                    const isTop2 = rank === 2;
                    const isTop3 = rank === 3;
                    
                    let rankBadgeBg = 'bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400';
                    if (isTop1) rankBadgeBg = 'bg-rose-500 text-white font-black';
                    else if (isTop2) rankBadgeBg = 'bg-orange-500 text-white font-black';
                    else if (isTop3) rankBadgeBg = 'bg-amber-500 text-white font-black';

                    listHtml += `
                        <div class="top-book-item p-4 flex items-center gap-4 cursor-pointer transition-colors hover:bg-gray-50 dark:hover:bg-gray-800/55 ${isTop1 ? 'bg-rose-50/40 dark:bg-rose-950/20' : ''}" data-index="${index}">
                            <div class="w-8 text-center font-black text-lg ${isTop1 ? 'text-rose-600' : 'text-gray-400'}">${rank}</div>
                            <div class="w-14 h-20 shrink-0 rounded-lg overflow-hidden bg-gray-100 dark:bg-gray-800 border border-gray-200/50">
                                <img src="${book.img}" alt="${book.title}" class="w-full h-full object-cover">
                            </div>
                            <div class="flex-grow min-w-0">
                                <div class="flex items-center gap-2 mb-1.5">
                                    <span class="px-2 py-0.5 rounded text-[10px] font-bold ${rankBadgeBg}">Top ${rank}</span>
                                </div>
                                <h4 class="font-bold text-gray-900 dark:text-white text-sm line-clamp-2">${book.title}</h4>
                            </div>
                        </div>
                    `;
                });

                listContainer.innerHTML = listHtml;

                const detailImg = document.getElementById('detail-img');
                const detailTitle = document.getElementById('detail-title');
                const detailAuthor = document.getElementById('detail-author');
                const detailDesc = document.getElementById('detail-desc');

                function updateDetail(index) {
                    const book = topBooks[index];
                    detailImg.src = book.img;
                    detailTitle.textContent = book.title;
                    detailAuthor.textContent = book.author;
                    detailDesc.textContent = book.desc;

                    document.querySelectorAll('.top-book-item').forEach((item, idx) => {
                        if (idx === index) {
                            item.classList.add('bg-rose-50/60', 'dark:bg-rose-950/30', 'border-l-4', 'border-rose-500');
                        } else {
                            item.classList.remove('bg-rose-50/60', 'dark:bg-rose-950/30', 'border-l-4', 'border-rose-500');
                        }
                    });
                }

                updateDetail(0);

                document.querySelectorAll('.top-book-item').forEach(item => {
                    item.addEventListener('click', function() {
                        const index = parseInt(this.getAttribute('data-index'));
                        updateDetail(index);
                    });
                });
            });
        </script>
